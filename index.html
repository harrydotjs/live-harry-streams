<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Piano Live Stream • 9:16 YouTube Shorts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            color: #fff;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ── 9:16 Vertical Shorts Container (1080x1920) ────────────────────── */
        #shorts-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: calc(100vh * 9 / 16);
            aspect-ratio: 9 / 16;
            overflow: hidden;
            background: #020409;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.95);
        }

        @media (max-aspect-ratio: 9/16) {
            #shorts-container {
                width: 100vw;
                height: calc(100vw * 16 / 9);
                max-width: none;
            }
        }

        #webgl-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        /* ── Minimalist LIVE Icon Only (Clean Broadcast Aesthetic) ─────────── */
        #live-badge {
            position: absolute;
            top: 55px;
            left: 24px;
            z-index: 10;
            background: rgba(255, 0, 68, 0.92);
            color: #fff;
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 1.8px;
            text-transform: uppercase;
            padding: 7px 16px;
            border-radius: 30px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 25px rgba(255, 0, 68, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.35);
            pointer-events: none;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #fff;
            animation: pulse-dot 1.2s infinite ease-in-out;
        }

        @keyframes pulse-dot {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.35;
                transform: scale(0.65);
            }
        }

        /* ── Absolute Bottom Animated GIF Badge (Continuous, White Border & Rounded Corners) ── */
        #bottom-gif-card {
            position: absolute;
            bottom: 140px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
            max-width: min(240px, 48%);
            max-height: 180px;
            border: 3.5px solid #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.85), 0 0 20px rgba(255, 255, 255, 0.35);
            overflow: hidden;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        #bottom-gif-card video,
        #bottom-gif-card img {
            display: block;
            width: 100%;
            height: auto;
            max-height: 215px;
            object-fit: cover;
            border-radius: 16px;
        }
    </style>
</head>

<body>
    <div id="shorts-container">
        <!-- 3D Three.js WebGL Canvas -->
        <canvas id="webgl-canvas"></canvas>

        <!-- Only the LIVE Badge -->
        <div id="live-badge">
            <span class="live-dot"></span>LIVE
        </div>

        <!-- Bottom Animated GIF / Video Badge with White Border & Rounded Corners -->
        <div id="bottom-gif-card">
            <video id="gif-video" autoplay loop muted playsinline>
                <source src="mygif.mp4" type="video/mp4">
                <source src="mygif.gif" type="video/mp4">
            </video>
            <img id="gif-img" src="mygif.gif" alt="GIF Animation" style="display: none;">
        </div>
    </div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        'use strict';

        // ═══════════════════════════════════════════════════════════════════════
        // 1. ACOUSTIC PIANO WEB AUDIO SYNTHESIZER (POLYPHONIC STRING MODELING)
        // ═══════════════════════════════════════════════════════════════════════
        class PianoAudioEngine {
            constructor() {
                this.ctx = null;
                this.masterGain = null;
                this.reverbNode = null;
                this.compressor = null;
                this.volume = 0.9;
                this.initialized = false;
            }

            init() {
                if (this.initialized) return;
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioContext();

                // Master Dynamics Compressor
                this.compressor = this.ctx.createDynamicsCompressor();
                this.compressor.threshold.setValueAtTime(-18, this.ctx.currentTime);
                this.compressor.knee.setValueAtTime(30, this.ctx.currentTime);
                this.compressor.ratio.setValueAtTime(8, this.ctx.currentTime);
                this.compressor.attack.setValueAtTime(0.003, this.ctx.currentTime);
                this.compressor.release.setValueAtTime(0.25, this.ctx.currentTime);

                // Master Gain
                this.masterGain = this.ctx.createGain();
                this.masterGain.gain.setValueAtTime(this.volume, this.ctx.currentTime);

                // Algorithmic Concert Hall Reverb
                this.createConcertReverb();

                this.compressor.connect(this.masterGain);
                this.masterGain.connect(this.ctx.destination);

                this.initialized = true;
            }

            unlock() {
                this.init();
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            createConcertReverb() {
                const length = this.ctx.sampleRate * 2.2;
                const impulse = this.ctx.createBuffer(2, length, this.ctx.sampleRate);
                const left = impulse.getChannelData(0);
                const right = impulse.getChannelData(1);

                for (let i = 0; i < length; i++) {
                    const decay = Math.exp(-i / (this.ctx.sampleRate * 0.75));
                    left[i] = (Math.random() * 2 - 1) * decay;
                    right[i] = (Math.random() * 2 - 1) * decay;
                }

                this.reverbNode = this.ctx.createConvolver();
                this.reverbNode.buffer = impulse;

                const reverbGain = this.ctx.createGain();
                reverbGain.gain.setValueAtTime(0.35, this.ctx.currentTime);

                this.reverbNode.connect(reverbGain);
                reverbGain.connect(this.compressor);
            }

            midiToFreq(midi) {
                return 440 * Math.pow(2, (midi - 69) / 12);
            }

            playNote(midi, duration = 1.0, velocity = 0.85) {
                if (!this.initialized) this.init();
                if (this.ctx.state === 'suspended') this.ctx.resume();

                const freq = this.midiToFreq(midi);
                const now = this.ctx.currentTime;
                const dur = Math.max(0.2, duration);

                // Acoustic Panning: Bass notes panned slightly left, Treble slightly right
                const panVal = Math.max(-0.4, Math.min(0.4, (midi - 60) / 40));
                let panner = null;
                if (this.ctx.createStereoPanner) {
                    panner = this.ctx.createStereoPanner();
                    panner.pan.setValueAtTime(panVal, now);
                }

                const noteGain = this.ctx.createGain();
                const velFactor = Math.pow(velocity, 1.3);

                // Attack -> Decay -> Sustain -> Release Envelope
                noteGain.gain.setValueAtTime(0.0001, now);
                noteGain.gain.exponentialRampToValueAtTime(0.9 * velFactor, now + 0.004);
                noteGain.gain.exponentialRampToValueAtTime(0.42 * velFactor, now + 0.15);
                noteGain.gain.exponentialRampToValueAtTime(0.0001, now + dur + 0.6);

                // Harmonic overtone synthesis (True acoustic string harmonics)
                const harmonics = [
                    { ratio: 1.0, gain: 0.65 },
                    { ratio: 2.0, gain: 0.28 },
                    { ratio: 3.0, gain: 0.14 },
                    { ratio: 4.0, gain: 0.06 }
                ];

                harmonics.forEach(h => {
                    const osc = this.ctx.createOscillator();
                    osc.type = h.ratio === 1.0 ? 'triangle' : 'sine';
                    osc.frequency.setValueAtTime(freq * h.ratio, now);

                    const hGain = this.ctx.createGain();
                    hGain.gain.setValueAtTime(h.gain, now);
                    hGain.gain.exponentialRampToValueAtTime(0.0001, now + (dur / h.ratio) + 0.4);

                    osc.connect(hGain);
                    hGain.connect(noteGain);

                    osc.start(now);
                    osc.stop(now + dur + 0.7);
                });

                // Hammer strike felt noise transient
                const bufferSize = this.ctx.sampleRate * 0.025;
                const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = (Math.random() * 2 - 1) * Math.exp(-i / (this.ctx.sampleRate * 0.005));
                }
                const whiteNoise = this.ctx.createBufferSource();
                whiteNoise.buffer = noiseBuffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(Math.min(1800, freq * 1.8), now);

                const noiseGain = this.ctx.createGain();
                noiseGain.gain.setValueAtTime(0.18 * velFactor, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.03);

                whiteNoise.connect(filter);
                filter.connect(noiseGain);
                noiseGain.connect(noteGain);

                whiteNoise.start(now);

                // Routing to compressor & reverb
                if (panner) {
                    noteGain.connect(panner);
                    panner.connect(this.compressor);
                    if (this.reverbNode) panner.connect(this.reverbNode);
                } else {
                    noteGain.connect(this.compressor);
                    if (this.reverbNode) noteGain.connect(this.reverbNode);
                }
            }
        }

        // ═══════════════════════════════════════════════════════════════════════
        // 2. PROCEDURAL 24/7 ORIGINAL PIANO ENGINE (100% COPYRIGHT-FREE & UNIQUE)
        // ═══════════════════════════════════════════════════════════════════════
        class ProceduralPianoEngine {
            constructor() {
                this.themes = [
                    {
                        name: "Ethereal Moonlight",
                        key: 57, // A minor
                        mode: "minor",
                        bpm: 78,
                        chords: [
                            { root: 45, isMajor: false, third: 3 }, // Am
                            { root: 41, isMajor: true, third: 4 }, // F
                            { root: 48, isMajor: true, third: 4 }, // C
                            { root: 43, isMajor: true, third: 4 }  // G
                        ]
                    },
                    {
                        name: "Whispering Rain",
                        key: 50, // D minor
                        mode: "minor",
                        bpm: 74,
                        chords: [
                            { root: 50, isMajor: false, third: 3 }, // Dm
                            { root: 46, isMajor: true, third: 4 }, // Bb
                            { root: 41, isMajor: true, third: 4 }, // F
                            { root: 48, isMajor: true, third: 4 }  // C
                        ]
                    },
                    {
                        name: "Eternal Dawn",
                        key: 48, // C major
                        mode: "major",
                        bpm: 84,
                        chords: [
                            { root: 48, isMajor: true, third: 4 }, // C
                            { root: 43, isMajor: true, third: 4 }, // G
                            { root: 45, isMajor: false, third: 3 }, // Am
                            { root: 41, isMajor: true, third: 4 }  // F
                        ]
                    },
                    {
                        name: "Midnight Solitude",
                        key: 52, // E minor
                        mode: "minor",
                        bpm: 72,
                        chords: [
                            { root: 40, isMajor: false, third: 3 }, // Em
                            { root: 50, isMajor: true, third: 4 }, // D
                            { root: 48, isMajor: true, third: 4 }, // C
                            { root: 50, isMajor: true, third: 4 }  // D
                        ]
                    },
                    {
                        name: "Nostalgic Road",
                        key: 53, // F major
                        mode: "major",
                        bpm: 80,
                        chords: [
                            { root: 46, isMajor: true, third: 4 }, // Bb
                            { root: 48, isMajor: true, third: 4 }, // C
                            { root: 45, isMajor: false, third: 3 }, // Am
                            { root: 50, isMajor: false, third: 3 }  // Dm
                        ]
                    },
                    {
                        name: "Starlight Reverie",
                        key: 55, // G major
                        mode: "major",
                        bpm: 86,
                        chords: [
                            { root: 43, isMajor: true, third: 4 }, // G
                            { root: 40, isMajor: false, third: 3 }, // Em
                            { root: 48, isMajor: true, third: 4 }, // C
                            { root: 43, isMajor: true, third: 4 }  // D
                        ]
                    },
                    {
                        name: "Serenade of the Sea",
                        key: 47, // B minor
                        mode: "minor",
                        bpm: 70,
                        chords: [
                            { root: 47, isMajor: false, third: 3 }, // Bm
                            { root: 45, isMajor: true, third: 4 }, // A
                            { root: 43, isMajor: true, third: 4 }, // G
                            { root: 45, isMajor: true, third: 4 }  // A
                        ]
                    },
                    {
                        name: "Lyrical Waltz",
                        key: 51, // Eb major
                        mode: "major",
                        bpm: 80,
                        chords: [
                            { root: 51, isMajor: true, third: 4 }, // Eb
                            { root: 44, isMajor: true, third: 4 }, // Ab
                            { root: 46, isMajor: true, third: 4 }, // Bb
                            { root: 51, isMajor: true, third: 4 }  // Eb
                        ]
                    }
                ];

                this.themeIndex = 0;
                this.barIndex = 0;
                this.totalBarsInTheme = 12; // 12 bars per movement (~35-45s)
                this.pendingNotes = [];     // upcoming notes waiting to be spawned into waterfall
                this.timelineHead = 0;      // seconds up to which musical bars have been planned
                this.streamTime = 0;        // current playback time in seconds
                this.lookaheadSec = 2.0;

                this.setupNewTheme(0);
            }

            clampMidi(m) {
                while (m < 36) m += 12;
                while (m > 96) m -= 12;
                return m;
            }

            setupNewTheme(idx) {
                this.themeIndex = (idx + this.themes.length) % this.themes.length;
                this.barIndex = 0;
            }

            generateNextBar() {
                const theme = this.themes[this.themeIndex];
                const secPerBeat = 60 / theme.bpm;
                const barDuration = 4.0 * secPerBeat;
                const chordIdx = this.barIndex % theme.chords.length;
                const chord = theme.chords[chordIdx];
                const isFinalBar = (this.barIndex === this.totalBarsInTheme - 1);

                const barStartTime = this.timelineHead;
                const notes = [];

                // ── LEFT HAND (BASS & ARPEGGIOS) ──────────────────────────────
                const bassRoot = this.clampMidi(chord.root);
                const third = chord.third;

                if (isFinalBar) {
                    // Final Cadence Resolution Chord
                    notes.push({ midi: bassRoot, dur: 3.0 * secPerBeat, beatOffset: 0, hand: 'L', vel: 0.82 });
                    notes.push({ midi: this.clampMidi(bassRoot + 12), dur: 3.0 * secPerBeat, beatOffset: 0, hand: 'L', vel: 0.70 });
                    notes.push({ midi: this.clampMidi(bassRoot + 12 + third), dur: 2.8 * secPerBeat, beatOffset: 0.5, hand: 'L', vel: 0.65 });
                    notes.push({ midi: this.clampMidi(bassRoot + 19), dur: 2.8 * secPerBeat, beatOffset: 1.0, hand: 'L', vel: 0.65 });
                } else if (this.barIndex % 2 === 0) {
                    // Flowing Arpeggio Style (8th notes across 4 beats)
                    const arpPattern = [
                        { beat: 0.0, offset: 0, dur: 0.7, vel: 0.76 },
                        { beat: 0.5, offset: 7, dur: 0.5, vel: 0.56 },
                        { beat: 1.0, offset: 12, dur: 0.5, vel: 0.60 },
                        { beat: 1.5, offset: 12 + third, dur: 0.5, vel: 0.58 },
                        { beat: 2.0, offset: 19, dur: 0.6, vel: 0.64 },
                        { beat: 2.5, offset: 12 + third, dur: 0.5, vel: 0.58 },
                        { beat: 3.0, offset: 12, dur: 0.5, vel: 0.60 },
                        { beat: 3.5, offset: 7, dur: 0.5, vel: 0.56 }
                    ];
                    arpPattern.forEach(p => {
                        notes.push({
                            midi: this.clampMidi(bassRoot + p.offset),
                            dur: p.dur * secPerBeat,
                            beatOffset: p.beat,
                            hand: 'L',
                            vel: p.vel
                        });
                    });
                } else {
                    // Warm Ballad Stride Style
                    notes.push({ midi: bassRoot, dur: 2.0 * secPerBeat, beatOffset: 0.0, hand: 'L', vel: 0.78 });
                    notes.push({ midi: this.clampMidi(bassRoot + 12), dur: 2.0 * secPerBeat, beatOffset: 0.0, hand: 'L', vel: 0.65 });
                    notes.push({ midi: this.clampMidi(bassRoot + 7), dur: 0.8 * secPerBeat, beatOffset: 1.5, hand: 'L', vel: 0.52 });
                    notes.push({ midi: this.clampMidi(bassRoot + 12 + third), dur: 1.6 * secPerBeat, beatOffset: 2.0, hand: 'L', vel: 0.62 });
                    notes.push({ midi: this.clampMidi(bassRoot + 19), dur: 1.6 * secPerBeat, beatOffset: 2.0, hand: 'L', vel: 0.58 });
                    notes.push({ midi: this.clampMidi(bassRoot + 14), dur: 0.6 * secPerBeat, beatOffset: 3.5, hand: 'L', vel: 0.50 });
                }

                // ── RIGHT HAND (CANTABILE MELODY) ─────────────────────────────
                const melodyOctave = 60 + (chord.root % 12);
                const chordTones = [
                    melodyOctave,
                    melodyOctave + third,
                    melodyOctave + 7,
                    melodyOctave + 12,
                    melodyOctave + 12 + third,
                    melodyOctave + 14, // 9th extension (sweet neo-classical color)
                    melodyOctave + 19
                ].map(m => this.clampMidi(m));

                if (isFinalBar) {
                    // Resolve peacefully on tonic melody
                    notes.push({
                        midi: this.clampMidi(chordTones[3] || chordTones[0]),
                        dur: 3.2 * secPerBeat,
                        beatOffset: 0.0,
                        hand: 'R',
                        vel: 0.90
                    });
                    notes.push({
                        midi: this.clampMidi(chordTones[2] || chordTones[1]),
                        dur: 2.8 * secPerBeat,
                        beatOffset: 0.5,
                        hand: 'R',
                        vel: 0.80
                    });
                } else {
                    // Expressive Melodic Phrasing
                    const phraseStep = this.barIndex % 4;
                    let rOffsets = [];

                    if (phraseStep === 0) {
                        // Statement
                        rOffsets = [
                            { beat: 0.0, dur: 1.5, idx: 2, vel: 0.92 },
                            { beat: 1.5, dur: 0.5, idx: 1, vel: 0.82 },
                            { beat: 2.0, dur: 1.0, idx: 3, vel: 0.88 },
                            { beat: 3.0, dur: 1.0, idx: 4, vel: 0.86 }
                        ];
                    } else if (phraseStep === 1) {
                        // Response / Variation
                        rOffsets = [
                            { beat: 0.0, dur: 1.0, idx: 3, vel: 0.90 },
                            { beat: 1.0, dur: 0.5, idx: 4, vel: 0.84 },
                            { beat: 1.5, dur: 0.5, idx: 3, vel: 0.82 },
                            { beat: 2.0, dur: 1.5, idx: 2, vel: 0.88 },
                            { beat: 3.5, dur: 0.5, idx: 1, vel: 0.80 }
                        ];
                    } else if (phraseStep === 2) {
                        // Emotional Climax (Higher register)
                        rOffsets = [
                            { beat: 0.0, dur: 1.0, idx: 4, vel: 0.94 },
                            { beat: 1.0, dur: 0.5, idx: 5, vel: 0.92 },
                            { beat: 1.5, dur: 0.5, idx: 4, vel: 0.88 },
                            { beat: 2.0, dur: 1.0, idx: 3, vel: 0.90 },
                            { beat: 3.0, dur: 1.0, idx: 2, vel: 0.85 }
                        ];
                    } else {
                        // Resolution Cadence
                        rOffsets = [
                            { beat: 0.0, dur: 2.0, idx: 2, vel: 0.90 },
                            { beat: 2.0, dur: 1.0, idx: 1, vel: 0.84 },
                            { beat: 3.0, dur: 1.0, idx: 0, vel: 0.88 }
                        ];
                    }

                    rOffsets.forEach(p => {
                        const noteMidi = chordTones[p.idx % chordTones.length];
                        notes.push({
                            midi: noteMidi,
                            dur: p.dur * secPerBeat,
                            beatOffset: p.beat,
                            hand: 'R',
                            vel: p.vel
                        });
                    });
                }

                // Add to pending notes with absolute strike timestamps
                notes.forEach(n => {
                    this.pendingNotes.push({
                        midi: n.midi,
                        dur: n.dur,
                        strikeTime: barStartTime + n.beatOffset * secPerBeat,
                        hand: n.hand,
                        vel: n.vel
                    });
                });

                // Advance bar
                this.barIndex++;
                if (this.barIndex >= this.totalBarsInTheme) {
                    // Natural breath pause of 0.9s (< 2 sec) before next theme starts
                    const breathPauseSec = 0.9;
                    this.timelineHead += barDuration + breathPauseSec;
                    this.setupNewTheme(this.themeIndex + 1);
                } else {
                    this.timelineHead += barDuration;
                }
            }

            update(delta, travelTime, onSpawnNote) {
                this.streamTime += delta;

                // Keep planning bars ahead into the timeline
                while (this.timelineHead < this.streamTime + travelTime + this.lookaheadSec) {
                    this.generateNextBar();
                }

                // Spawn notes whose departure time has arrived
                for (let i = this.pendingNotes.length - 1; i >= 0; i--) {
                    const n = this.pendingNotes[i];
                    if (this.streamTime >= n.strikeTime - travelTime) {
                        onSpawnNote(n.midi, n.dur, n.hand, n.vel);
                        this.pendingNotes.splice(i, 1);
                    }
                }
            }
        }

        // ═══════════════════════════════════════════════════════════════════════
        // 3. THREE.JS 3D STAGE & PIANO KEYBOARD IN 9:16 VERTICAL CANVAS
        // ═══════════════════════════════════════════════════════════════════════
        const container = document.getElementById('shorts-container');
        const canvas = document.getElementById('webgl-canvas');

        // High-Performance 60 FPS WebGL Renderer (Optimized for Zero-Lag Streaming)
        const renderer = new THREE.WebGLRenderer({
            canvas,
            antialias: false,
            alpha: false,
            powerPreference: 'high-performance',
            precision: 'mediump',
            failIfMajorPerformanceCaveat: false // Guarantees WebGL initializes cleanly on headless SwiftShader
        });

        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(1); // Strict 1:1 pixel ratio eliminates software supersampling lag
        renderer.shadowMap.enabled = false; // Disables CPU-heavy 2048x2048 depth maps for 60 FPS fluidity

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020409);

        // Vertical 9:16 Camera framing - optimized for YouTube Shorts portrait viewing
        const camera = new THREE.PerspectiveCamera(
            64, // Optimal vertical FOV for framing full 61 keys + falling notes waterfall
            container.clientWidth / container.clientHeight,
            0.1,
            140
        );

        // ── Fast High-Efficiency Stage Lighting (Zero GPU Shadow Cost) ────────
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
        scene.add(ambientLight);

        // Overhead Key Illumination
        const mainLight = new THREE.DirectionalLight(0xffffff, 1.4);
        mainLight.position.set(0, 25, 12);
        scene.add(mainLight);

        // Dynamic Accent Rim Lights (Electric Cyan & Neon Magenta)
        const cyanRim = new THREE.PointLight(0x00dfd8, 1.8, 35);
        cyanRim.position.set(-14, 8, -4);
        scene.add(cyanRim);

        const magentaRim = new THREE.PointLight(0xff0077, 1.8, 35);
        magentaRim.position.set(14, 8, -4);
        scene.add(magentaRim);

        // Reflective Glossy Floor
        const floorGeo = new THREE.PlaneGeometry(80, 80);
        const floorMat = new THREE.MeshStandardMaterial({
            color: 0x04060d,
            roughness: 0.35,
            metalness: 0.4
        });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -2.2;
        scene.add(floor);

        // ── 61-Key Grand Piano Construction (C2 to C7) ──────────────────────
        const START_MIDI = 36; // C2
        const NUM_KEYS = 61;

        const WHITE_KEY_WIDTH = 0.58;
        const WHITE_KEY_LENGTH = 3.6;
        const WHITE_KEY_HEIGHT = 0.55;

        const BLACK_KEY_WIDTH = 0.34;
        const BLACK_KEY_LENGTH = 2.2;
        const BLACK_KEY_HEIGHT = 0.5;

        const isBlackKey = [false, true, false, true, false, false, true, false, true, false, true, false];

        const pianoGroup = new THREE.Group();
        scene.add(pianoGroup);

        const whiteKeyMaterial = new THREE.MeshStandardMaterial({
            color: 0xfbf9f6,
            roughness: 0.18,
            metalness: 0.12
        });

        const blackKeyMaterial = new THREE.MeshStandardMaterial({
            color: 0x101012,
            roughness: 0.35,
            metalness: 0.8
        });

        const activeWhiteMaterial = new THREE.MeshStandardMaterial({
            color: 0x00dfd8,
            emissive: 0x00dfd8,
            emissiveIntensity: 0.7,
            roughness: 0.1
        });

        const activeBlackMaterial = new THREE.MeshStandardMaterial({
            color: 0xff0077,
            emissive: 0xff0077,
            emissiveIntensity: 0.8,
            roughness: 0.1
        });

        const keyMeshes = new Map();

        let whiteKeyCount = 0;
        for (let i = 0; i < NUM_KEYS; i++) {
            const midi = START_MIDI + i;
            if (!isBlackKey[midi % 12]) whiteKeyCount++;
        }

        const keyboardWidth = whiteKeyCount * WHITE_KEY_WIDTH;
        const startX = -keyboardWidth / 2 + WHITE_KEY_WIDTH / 2;

        let curWhiteIndex = 0;
        for (let i = 0; i < NUM_KEYS; i++) {
            const midi = START_MIDI + i;
            const black = isBlackKey[midi % 12];

            if (!black) {
                const pivot = new THREE.Group();
                const xPos = startX + curWhiteIndex * WHITE_KEY_WIDTH;
                pivot.position.set(xPos, 0, -WHITE_KEY_LENGTH / 2);

                const geo = new THREE.BoxGeometry(WHITE_KEY_WIDTH * 0.94, WHITE_KEY_HEIGHT, WHITE_KEY_LENGTH);
                const mesh = new THREE.Mesh(geo, whiteKeyMaterial);
                mesh.position.set(0, 0, WHITE_KEY_LENGTH / 2);
                mesh.castShadow = true;
                mesh.receiveShadow = true;

                pivot.add(mesh);
                pianoGroup.add(pivot);

                keyMeshes.set(midi, {
                    mesh,
                    pivot,
                    isBlack: false,
                    baseMat: whiteKeyMaterial,
                    activeMat: activeWhiteMaterial,
                    x: xPos,
                    isPressed: false
                });

                curWhiteIndex++;
            }
        }

        curWhiteIndex = 0;
        for (let i = 0; i < NUM_KEYS; i++) {
            const midi = START_MIDI + i;
            const black = isBlackKey[midi % 12];

            if (!black) {
                curWhiteIndex++;
            } else {
                const pivot = new THREE.Group();
                const xPos = startX + (curWhiteIndex - 0.5) * WHITE_KEY_WIDTH;
                pivot.position.set(xPos, WHITE_KEY_HEIGHT * 0.5, -WHITE_KEY_LENGTH / 2);

                const geo = new THREE.BoxGeometry(BLACK_KEY_WIDTH, BLACK_KEY_HEIGHT, BLACK_KEY_LENGTH);
                const mesh = new THREE.Mesh(geo, blackKeyMaterial);
                mesh.position.set(0, BLACK_KEY_HEIGHT / 2, BLACK_KEY_LENGTH / 2);
                mesh.castShadow = true;
                mesh.receiveShadow = true;

                pivot.add(mesh);
                pianoGroup.add(pivot);

                keyMeshes.set(midi, {
                    mesh,
                    pivot,
                    isBlack: true,
                    baseMat: blackKeyMaterial,
                    activeMat: activeBlackMaterial,
                    x: xPos,
                    isPressed: false
                });
            }
        }

        // Piano Casing Elements
        const bodyMat = new THREE.MeshStandardMaterial({
            color: 0x07090f,
            roughness: 0.15,
            metalness: 0.35
        });

        // Top Fallboard block
        const fallboardGeo = new THREE.BoxGeometry(keyboardWidth + 1.2, 2.4, 2.5);
        const fallboard = new THREE.Mesh(fallboardGeo, bodyMat);
        fallboard.position.set(0, 0.9, -WHITE_KEY_LENGTH / 2 - 1.2);
        fallboard.castShadow = true;
        pianoGroup.add(fallboard);

        // Red Felt Strip
        const feltMat = new THREE.MeshStandardMaterial({ color: 0xb50025, roughness: 0.9 });
        const feltGeo = new THREE.BoxGeometry(keyboardWidth, 0.08, 0.35);
        const felt = new THREE.Mesh(feltGeo, feltMat);
        felt.position.set(0, WHITE_KEY_HEIGHT * 0.52, -WHITE_KEY_LENGTH / 2 + 0.18);
        pianoGroup.add(felt);

        // Left & Right Piano Cheeks
        const cheekGeo = new THREE.BoxGeometry(0.55, 1.8, WHITE_KEY_LENGTH + 2.5);
        const leftCheek = new THREE.Mesh(cheekGeo, bodyMat);
        leftCheek.position.set(-keyboardWidth / 2 - 0.28, 0.35, -0.6);
        pianoGroup.add(leftCheek);

        const rightCheek = new THREE.Mesh(cheekGeo, bodyMat);
        rightCheek.position.set(keyboardWidth / 2 + 0.28, 0.35, -0.6);
        pianoGroup.add(rightCheek);

        // Front Lip Rail
        const lipGeo = new THREE.BoxGeometry(keyboardWidth + 1.1, 0.8, 0.45);
        const lip = new THREE.Mesh(lipGeo, bodyMat);
        lip.position.set(0, -0.28, WHITE_KEY_LENGTH / 2 + 0.22);
        pianoGroup.add(lip);

        // ═══════════════════════════════════════════════════════════════════════
        // 4. SYNTHESIA 3D WATERFALL FALLING NOTES & SPARKS (ZERO ALLOC POOL)
        // ═══════════════════════════════════════════════════════════════════════
        const noteBarGroup = new THREE.Group();
        scene.add(noteBarGroup);

        const WATERFALL_START_Y = 19;
        const WATERFALL_TARGET_Y = 0.2;
        const WATERFALL_START_Z = -14;
        const WATERFALL_TARGET_Z = 0.5;
        const NOTE_SPEED = 14;

        const activeNoteBars = [];

        // Shared Geometry and Materials (Zero GC spikes, 60 FPS constant speed)
        const sharedNoteGeo = new THREE.BoxGeometry(1, 1, 1);
        const rightNoteMat = new THREE.MeshBasicMaterial({ color: 0x00dfd8 });
        const leftNoteMat = new THREE.MeshBasicMaterial({ color: 0xffa500 });

        function spawnFallingNote(midi, durationSec, hand = 'R', velocity = 0.85) {
            const keyData = keyMeshes.get(midi);
            if (!keyData) return;

            const isRight = hand === 'R';
            const barWidth = keyData.isBlack ? BLACK_KEY_WIDTH * 0.9 : WHITE_KEY_WIDTH * 0.82;
            const barLength = Math.max(0.6, durationSec * 6.5);

            const mesh = new THREE.Mesh(sharedNoteGeo, isRight ? rightNoteMat : leftNoteMat);
            mesh.scale.set(barWidth, 0.25, barLength);
            mesh.position.set(keyData.x, WATERFALL_START_Y, WATERFALL_START_Z);

            noteBarGroup.add(mesh);

            activeNoteBars.push({
                mesh,
                midi,
                durationSec,
                velocity,
                hand,
                progress: 0,
                keyData,
                triggered: false,
                totalTravelTime: (WATERFALL_START_Y - WATERFALL_TARGET_Y) / NOTE_SPEED
            });
        }

        // Particle Spark Burst System (Optimized for High Framerate)
        const particleCount = 60;
        const pGeo = new THREE.BufferGeometry();
        const pPos = new Float32Array(particleCount * 3);
        const pVel = new Float32Array(particleCount * 3);
        const pLife = new Float32Array(particleCount);

        for (let i = 0; i < particleCount; i++) {
            pLife[i] = -1;
        }

        pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
        const pMat = new THREE.PointsMaterial({
            size: 0.38,
            color: 0x00dfd8,
            blending: THREE.AdditiveBlending,
            transparent: true,
            opacity: 0.85
        });
        const particleSystem = new THREE.Points(pGeo, pMat);
        scene.add(particleSystem);

        function triggerSparkBurst(x, z, isCyan = true) {
            let spawned = 0;
            const targetColor = isCyan ? new THREE.Color(0x00dfd8) : new THREE.Color(0xffaa00);
            pMat.color.lerp(targetColor, 0.4);

            for (let i = 0; i < particleCount && spawned < 10; i++) {
                if (pLife[i] <= 0) {
                    pLife[i] = 0.8;
                    pPos[i * 3] = x + (Math.random() - 0.5) * 0.4;
                    pPos[i * 3 + 1] = 0.5;
                    pPos[i * 3 + 2] = z + (Math.random() - 0.5) * 0.4;

                    pVel[i * 3] = (Math.random() - 0.5) * 2.2;
                    pVel[i * 3 + 1] = Math.random() * 3.8 + 1.8;
                    pVel[i * 3 + 2] = (Math.random() - 0.5) * 2.2;
                    spawned++;
                }
            }
        }

        function pressKey(midi, duration = 0.5, isRightHand = true) {
            const data = keyMeshes.get(midi);
            if (!data) return;

            data.isPressed = true;
            data.mesh.material = data.activeMat;
            data.pivot.rotation.x = 0.045; // ~2.6 degrees downward pivot tilt
            data.depressTimer = Math.max(0.12, duration - 0.02);

            triggerSparkBurst(data.x, 0.8, isRightHand);
        }

        // ═══════════════════════════════════════════════════════════════════════
        // 5. CONTINUOUS MUSIC SCHEDULER (NON-STOP 24/7 PROCEDURAL STREAM)
        // ═══════════════════════════════════════════════════════════════════════
        const audioEngine = new PianoAudioEngine();
        const composer = new ProceduralPianoEngine();
        const NOTE_TRAVEL_TIME = (WATERFALL_START_Y - WATERFALL_TARGET_Y) / NOTE_SPEED;

        // ═══════════════════════════════════════════════════════════════════════
        // 6. CINEMATIC 180-DEGREE MOVEMENT CAMERA (NEVER GOES BEHIND PIANO)
        // ═══════════════════════════════════════════════════════════════════════
        // Smooth 180-degree frontal camera sweeping back and forth
        // Arc: -72° (front-left) -> 0° (front-center) -> +72° (front-right) -> and back!
        let sweepTimer = 0;
        const SWEEP_SPEED = 0.08;      // Smooth, majestic cinema sweep
        const MAX_SWEEP_ANGLE = 1.25;  // ~72 degrees to either side (144-degree frontal arc within 180° bounds)
        const CAMERA_RADIUS = 29;      // Distance to frame full keyboard with margins in 9:16 vertical
        const CAMERA_BASE_Y = 20.0;    // Elevated view showing both falling notes and keys

        function updateCinematicCamera(delta) {
            sweepTimer += delta * SWEEP_SPEED;

            // Sine oscillation: oscillates between -MAX_SWEEP_ANGLE and +MAX_SWEEP_ANGLE
            // Because theta is always in [-72°, +72°], cos(theta) is ALWAYS POSITIVE (> 0.3)
            // This strictly guarantees the camera NEVER rotates behind the piano (180° movement only!)
            const theta = Math.sin(sweepTimer) * MAX_SWEEP_ANGLE;

            camera.position.x = Math.sin(theta) * (CAMERA_RADIUS * 0.72);
            camera.position.z = Math.cos(theta) * CAMERA_RADIUS + 1.2;
            camera.position.y = CAMERA_BASE_Y + Math.cos(theta * 2) * 2.5;

            // Camera continuously focuses on the center of the active keyboard
            camera.lookAt(0, -0.1, 0.8);
        }

        // ═══════════════════════════════════════════════════════════════════════
        // 7. MAIN RENDER LOOP & AUTONOMOUS STARTUP
        // ═══════════════════════════════════════════════════════════════════════
        let lastTime = performance.now();

        function animate(now) {
            requestAnimationFrame(animate);

            const delta = Math.min(0.1, (now - lastTime) / 1000);
            lastTime = now;

            // Continuous 24/7 Procedural Music Scheduling (Non-stop, 100% unique & copyright-free)
            composer.update(delta, NOTE_TRAVEL_TIME, (midi, dur, hand, vel) => {
                spawnFallingNote(midi, dur, hand, vel);
            });

            // Update 3D Waterfall Falling Notes
            for (let i = activeNoteBars.length - 1; i >= 0; i--) {
                const bar = activeNoteBars[i];
                bar.progress += delta / bar.totalTravelTime;

                bar.mesh.position.y = THREE.MathUtils.lerp(WATERFALL_START_Y, WATERFALL_TARGET_Y, bar.progress);
                bar.mesh.position.z = THREE.MathUtils.lerp(WATERFALL_START_Z, WATERFALL_TARGET_Z, bar.progress);

                if (bar.progress >= 1.0 && !bar.triggered) {
                    bar.triggered = true;
                    audioEngine.playNote(bar.midi, bar.durationSec, bar.velocity || 0.85);
                    pressKey(bar.midi, bar.durationSec, bar.hand === 'R');
                }

                if (bar.progress >= 1.25) {
                    noteBarGroup.remove(bar.mesh);
                    activeNoteBars.splice(i, 1);
                }
            }

            // Smooth physical key recovery animation
            keyMeshes.forEach(data => {
                if (data.isPressed) {
                    data.depressTimer -= delta;
                    if (data.depressTimer <= 0) {
                        data.pivot.rotation.x = 0;
                        data.mesh.material = data.baseMat;
                        data.isPressed = false;
                    }
                }
            });

            // Update Particle Sparks
            const posAttr = particleSystem.geometry.attributes.position;
            for (let i = 0; i < particleCount; i++) {
                if (pLife[i] > 0) {
                    pLife[i] -= delta * 1.8;
                    pPos[i * 3] += pVel[i * 3] * delta;
                    pPos[i * 3 + 1] += pVel[i * 3 + 1] * delta;
                    pPos[i * 3 + 2] += pVel[i * 3 + 2] * delta;
                    pVel[i * 3 + 1] -= 9.8 * delta;
                } else {
                    pPos[i * 3 + 1] = -50;
                }
            }
            posAttr.needsUpdate = true;

            // Smooth 180-degree Cinematic Camera Glide
            updateCinematicCamera(delta);

            renderer.render(scene, camera);
        }

        // ═══════════════════════════════════════════════════════════════════════
        // 8. CONTINUOUS BOTTOM GIF / VIDEO BADGE HANDLER
        // ═══════════════════════════════════════════════════════════════════════
        const gifVideo = document.getElementById('gif-video');
        const gifImg = document.getElementById('gif-img');

        function initBottomGif() {
            if (gifVideo) {
                gifVideo.play().catch(() => { });
                gifVideo.addEventListener('ended', () => {
                    gifVideo.currentTime = 0;
                    gifVideo.play().catch(() => { });
                });
            }

            // Detect if an actual animated .gif exists in directory and swap automatically
            const testGif = new Image();
            testGif.onload = function () {
                if (gifImg && gifVideo) {
                    gifImg.src = this.src;
                    gifImg.style.display = 'block';
                    gifVideo.style.display = 'none';
                }
            };
            testGif.src = 'mygif.gif';
        }

        initBottomGif();

        // Autonomous audio unlock (handles autoplay on load & interaction)
        function startConcert() {
            audioEngine.unlock();
            if (gifVideo && gifVideo.paused) {
                gifVideo.play().catch(() => { });
            }
        }

        ['DOMContentLoaded', 'load', 'pointerdown', 'click', 'keydown', 'touchstart'].forEach(ev => {
            window.addEventListener(ev, startConcert, { passive: true });
        });

        // Continuous keep-alive to resume AudioContext immediately when browser permits
        setInterval(() => {
            if (audioEngine.ctx && audioEngine.ctx.state === 'suspended') {
                audioEngine.ctx.resume().catch(() => { });
            }
        }, 800);

        // Window resize keeps exact 9:16 vertical ratio
        function onResize() {
            const w = container.clientWidth;
            const h = container.clientHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }
        window.addEventListener('resize', onResize);

        // Start non-stop concert
        startConcert();
        requestAnimationFrame(animate);
    </script>
</body>
