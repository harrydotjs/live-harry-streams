<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>24/7 YouTube Live Video Stream</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ── Vertical 9:16 YouTube Shorts Stream Canvas (1080x1920) ─────── */
        #stream-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 56.25vh;
            /* 9:16 aspect ratio (9/16 = 56.25vh) */
            aspect-ratio: 9 / 16;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #000;
            transform: translateZ(0);
        }

        /* Video Stage: Centers the 1:1 Square Video vertically */
        #video-stage {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* ── 1:1 Square Video Frame (1080px × 1080px in 9:16 Shorts Feed) ── */
        #player-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            /* Exact 1:1 Square Ratio */
            max-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #000;
            border: none;
            box-shadow: none;
            transform: translateZ(0);
            will-change: transform;
        }

        /* Direct HTML5 Video Player inside 1:1 Frame */
        #stream-video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Crops 16:9 widescreen into a pure 1:1 square with zero letterboxing */
            background: #000;
            border: none;
            outline: none;
            pointer-events: none !important;
            transform: translateZ(0);
            will-change: transform;
            backface-visibility: hidden;
        }

        .fit-contain #stream-video {
            object-fit: contain !important;
            /* Letterboxed inside 1:1 square if requested */
        }

        /* Transparent Shield: blocks all user interaction & prevents controls */
        #shield {
            position: absolute;
            inset: 0;
            z-index: 5;
            background: transparent;
            cursor: none !important;
        }

        /* ── Broadcast Overlays (Top & Bottom Margins of 9:16 Canvas) ──── */
        #overlays {
            position: absolute;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 80px 22px 55px 22px;
        }

        /* Top Bar: LIVE Badge & Call-To-Action */
        .top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            gap: 16px;
        }

        .live-tag {
            background: #ff0044;
            color: #fff;
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 1.5px;
            padding: 8px 18px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.6);
            text-transform: uppercase;
            transform: translateZ(0);
        }

        .live-tag::before {
            content: '';
            width: 9px;
            height: 9px;
            background: #fff;
            border-radius: 50%;
            animation: pulse-dot 1.2s infinite ease-in-out;
        }

        @keyframes pulse-dot {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.3;
                transform: scale(0.7);
            }
        }

        /* Main Call to Action Pill */
        .cta-pill {
            background: rgba(14, 18, 32, 0.96);
            border: 2px solid #ff3366;
            border-radius: 50px;
            padding: 10px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 0.8px;
            color: #fff;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.6);
            transform: translateZ(0);
            will-change: transform;
        }

        .cta-pill .heart {
            color: #ff3366;
            font-size: 17px;
            animation: heart-beat 1.4s infinite ease-in-out;
            transform: translateZ(0);
        }

        .cta-pill .bell {
            color: #ffcc00;
            font-size: 16px;
            animation: bell-ring 2.5s infinite ease-in-out;
            transform: translateZ(0);
        }

        @keyframes heart-beat {

            0%,
            100% {
                transform: scale(1);
            }

            15% {
                transform: scale(1.3);
            }

            30% {
                transform: scale(1);
            }

            45% {
                transform: scale(1.2);
            }
        }

        @keyframes bell-ring {

            0%,
            100% {
                transform: rotate(0deg);
            }

            10% {
                transform: rotate(16deg);
            }

            20% {
                transform: rotate(-16deg);
            }

            30% {
                transform: rotate(12deg);
            }

            40% {
                transform: rotate(-12deg);
            }

            50% {
                transform: rotate(0deg);
            }
        }

        /* Floating Reaction Emojis */
        .reaction-container {
            position: absolute;
            right: 40px;
            bottom: 110px;
            width: 80px;
            height: 350px;
            pointer-events: none;
            overflow: visible;
        }

        .floating-heart {
            position: absolute;
            bottom: 0;
            font-size: 26px;
            animation: float-up 3.5s ease-out forwards;
            opacity: 0;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
            transform: translateZ(0);
            will-change: transform, opacity;
        }

        @keyframes float-up {
            0% {
                transform: translate3d(0, 0, 0) scale(0.6) rotate(0deg);
                opacity: 0;
            }

            15% {
                opacity: 1;
                transform: translate3d(0, -40px, 0) scale(1.1) rotate(-8deg);
            }

            80% {
                opacity: 0.9;
            }

            100% {
                transform: translate3d(0, -320px, 0) scale(1.3) rotate(20deg);
                opacity: 0;
            }
        }

        /* Bottom Engaging Banner */
        .bottom-banner {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 8px;
        }

        .engagement-card {
            background: rgba(14, 18, 34, 0.96);
            border: 1.5px solid rgba(255, 60, 110, 0.6);
            border-radius: 18px;
            padding: 12px 28px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.7);
            transform: translateZ(0);
            transition: transform 0.3s ease;
        }

        .engagement-card.highlight {
            animation: highlight-pulse 1.8s infinite;
        }

        @keyframes highlight-pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.03);
            }
        }

        .banner-icon {
            font-size: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .banner-text {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .banner-title {
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #fff;
            text-transform: uppercase;
        }

        .banner-title span {
            color: #ff3366;
        }

        .banner-sub {
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.8);
            letter-spacing: 0.3px;
        }

        .banner-sub span {
            color: #ffcc00;
            font-weight: 700;
        }
    </style>
</head>

<body>
    <div id="stream-container">
        <!-- Video Stage (Centers the 1:1 Square Video) -->
        <div id="video-stage">
            <div id="player-wrapper">
                <video id="stream-video" playsinline autoplay loop preload="auto">
                </video>
                <!-- Click shield prevents player controls & interaction -->
                <div id="shield"></div>
            </div>
        </div>

        <!-- Broadcast Overlays -->
        <div id="overlays">
            <!-- Top Status Row -->
            <div class="top-row">
                <div class="live-tag">LIVE</div>
                <div class="cta-pill" id="topCta">
                    <span class="heart">❤️</span>
                    <span>LIKE</span>
                    <span class="bell">🔔</span>
                    <span>SUBSCRIBE</span>
                </div>
            </div>

            <!-- Reaction Hearts Animation -->
            <div class="reaction-container" id="reactionBox"></div>



        </div>
    </div>

    <script>
        'use strict';

        // ═══════════════════════════════════════════════════════════════
        // 1. CONFIGURATION (DEFAULT VIDEO FILE + START TIME)
        // ═══════════════════════════════════════════════════════════════
        // Direct video link from Archive.org or local file
        const DEFAULT_VIDEO_FILE = 'https://archive.org/download/video_20261118/video.mp4';

        // Default starting timestamp: in seconds or mm:ss format (e.g. 0, 90, '1:30', '3:00')
        const DEFAULT_START_TIME = '50:00';

        // Helper: converts seconds, '1:30', '01:15:30', or '2m15s' into integer seconds
        function parseTimeToSeconds(timeVal) {
            if (!timeVal) return 0;
            if (typeof timeVal === 'number') return Math.max(0, timeVal);
            timeVal = String(timeVal).trim().toLowerCase();

            if (/^\d+(\.\d+)?$/.test(timeVal)) return parseFloat(timeVal);
            if (/[hms]/.test(timeVal)) {
                let total = 0;
                const h = timeVal.match(/(\d+)h/);
                const m = timeVal.match(/(\d+)m/);
                const s = timeVal.match(/(\d+)s/);
                if (h) total += parseInt(h[1], 10) * 3600;
                if (m) total += parseInt(m[1], 10) * 60;
                if (s) total += parseInt(s[1], 10);
                return total;
            }
            if (timeVal.includes(':')) {
                const parts = timeVal.split(':').map(Number);
                if (parts.length === 2) return (parts[0] * 60) + parts[1];
                if (parts.length === 3) return (parts[0] * 3600) + (parts[1] * 60) + parts[2];
            }
            return parseFloat(timeVal) || 0;
        }

        const params = new URLSearchParams(window.location.search);
        let VIDEO_SRC = params.get('v') || params.get('video') || params.get('src') || DEFAULT_VIDEO_FILE;
        const rawTime = params.get('t') || params.get('start') || DEFAULT_START_TIME;
        const START_TIME = parseTimeToSeconds(rawTime);
        const FIT_MODE = params.get('fit') || 'cover'; // Default 'cover' crops 16:9 to fill 1:1 square
        const ANNOUNCE_INTERVAL = Math.max(25, Number(params.get('interval')) || 60);

        if (FIT_MODE === 'contain') {
            document.getElementById('player-wrapper').classList.add('fit-contain');
        }

        console.log(`[Stream Player] Loading video: ${VIDEO_SRC} | Starting at: ${START_TIME}s`);

        // ═══════════════════════════════════════════════════════════════
        // 2. DIRECT HTML5 VIDEO PLAYER (ZERO CONTROLS, AUTONOMOUS AUTO-LOOP)
        // ═══════════════════════════════════════════════════════════════
        const videoEl = document.getElementById('stream-video');

        // Apply HTML5 Media Fragment directly so browser buffers from START_TIME from the very first byte
        if (START_TIME > 0 && !VIDEO_SRC.includes('#t=')) {
            videoEl.src = `${VIDEO_SRC}#t=${START_TIME}`;
        } else {
            videoEl.src = VIDEO_SRC;
        }

        // Auto fallback: if local file is missing, stream directly from archive.org
        videoEl.addEventListener('error', () => {
            if (!videoEl.src.includes('archive.org')) {
                console.warn('[Stream Player] Local video not found, streaming from archive.org:', DEFAULT_VIDEO_FILE);
                VIDEO_SRC = DEFAULT_VIDEO_FILE;
                videoEl.src = START_TIME > 0 ? `${DEFAULT_VIDEO_FILE}#t=${START_TIME}` : DEFAULT_VIDEO_FILE;
                startPlayback();
            }
        });

        let seekConfirmed = false;
        let isSeeking = false;

        function applyStartTime() {
            if (START_TIME <= 0 || seekConfirmed || isSeeking) return;

            if (videoEl.readyState >= 1) { // HAVE_METADATA or higher
                if (videoEl.currentTime >= START_TIME - 1.0) {
                    seekConfirmed = true;
                    console.log(`[Stream Player] Start time confirmed at: ${videoEl.currentTime.toFixed(2)}s`);
                    return;
                }

                try {
                    isSeeking = true;
                    console.log(`[Stream Player] Applying start time: ${START_TIME}s (current: ${videoEl.currentTime.toFixed(2)}s)`);
                    videoEl.currentTime = START_TIME;
                } catch (e) {
                    isSeeking = false;
                    console.warn('[Stream Player] Seek notice:', e);
                }
            }
        }

        videoEl.addEventListener('seeked', () => {
            isSeeking = false;
            if (videoEl.currentTime >= START_TIME - 1.0) {
                seekConfirmed = true;
                console.log(`[Stream Player] Seek completed at: ${videoEl.currentTime.toFixed(2)}s`);
            }
        });

        ['loadedmetadata', 'loadeddata', 'canplay', 'canplaythrough'].forEach(ev => {
            videoEl.addEventListener(ev, applyStartTime);
        });

        // Timeupdate safety lock: if video plays before seek takes effect, ensure it jumps to START_TIME once
        videoEl.addEventListener('timeupdate', () => {
            if (!seekConfirmed && START_TIME > 0 && !isSeeking && !videoEl.seeking) {
                if (videoEl.currentTime < START_TIME - 1.0) {
                    applyStartTime();
                } else {
                    seekConfirmed = true;
                    console.log(`[Stream Player] Seek verified on playback: ${videoEl.currentTime.toFixed(2)}s`);
                }
            }
        });

        // Instant autonomous playback
        function startPlayback() {
            applyStartTime();
            const playPromise = videoEl.play();
            if (playPromise !== undefined) {
                playPromise.catch(err => {
                    console.warn('[Stream Player] Autoplay with audio restricted, resuming muted first:', err);
                    videoEl.muted = true;
                    videoEl.play().catch(() => { });
                });
            }
        }

        startPlayback();

        // Progressive autonomous un-muting
        videoEl.addEventListener('playing', () => {
            applyStartTime();
            setTimeout(() => {
                try {
                    videoEl.muted = false;
                    videoEl.volume = 1.0;
                } catch (e) { }
            }, 500);
        });

        // Auto-loop when video reaches the end (restarts at START_TIME)
        videoEl.addEventListener('ended', () => {
            try {
                seekConfirmed = false;
                videoEl.currentTime = START_TIME > 0 ? START_TIME : 0;
                videoEl.play();
            } catch (e) { }
        });

        // Watchdog: ensures video is always playing and never frozen
        setInterval(() => {
            if (videoEl.paused) {
                startPlayback();
            }
        }, 1500);

        // Global autonomous audio unlock on any user interaction
        ['DOMContentLoaded', 'load', 'click', 'pointerdown', 'mousedown', 'keydown', 'touchstart'].forEach(ev => {
            window.addEventListener(ev, () => {
                try {
                    videoEl.muted = false;
                    videoEl.volume = 1.0;
                    if (videoEl.paused) videoEl.play();
                } catch (e) { }
            }, { passive: true });
        });

        // ═══════════════════════════════════════════════════════════════
        // 3. VOICE ANNOUNCEMENTS (DOUBLE TAP & SUBSCRIBE)
        // ═══════════════════════════════════════════════════════════════
        const ANNOUNCEMENTS = [
            { id: 'cta_1', text: "Double tap on the screen right now, and subscribe to the channel for more non-stop streams!" },
            { id: 'cta_2', text: "If you're enjoying the stream, double tap your screen and hit that subscribe button!" },
            { id: 'cta_3', text: "Don't forget to double tap the screen to support us, and subscribe so you never miss another stream!" },
            { id: 'cta_4', text: "Double tap the screen to show some love, and subscribe to the channel right now!" },
            { id: 'cta_5', text: "Double tap that screen right now, and make sure to subscribe to the channel!" }
        ];

        let ctaIndex = 0;
        let voiceCache = {};
        let currentAudio = null;

        function triggerVoiceAnnouncement() {
            const item = ANNOUNCEMENTS[ctaIndex % ANNOUNCEMENTS.length];
            ctaIndex++;

            // Highlight the on-screen banner
            highlightBanner(item.text);

            // Spawn celebratory reaction hearts
            spawnReactionBurst();

            // Play high-definition neural voice audio clip with SpeechSynthesis fallback
            playVoice(item.id, item.text);
        }

        function playVoice(clipId, fallbackText) {
            try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch (e) { }
            if (currentAudio) {
                try { currentAudio.pause(); currentAudio.currentTime = 0; } catch (e) { }
            }

            try {
                let snd = voiceCache[clipId];
                if (!snd) {
                    snd = new Audio(`audio/${clipId}.mp3`);
                    voiceCache[clipId] = snd;
                }
                snd.currentTime = 0;
                snd.volume = 1.0;
                currentAudio = snd;
                const p = snd.play();
                if (p !== undefined) {
                    p.catch(() => {
                        fallbackSpeech(fallbackText);
                    });
                    return;
                }
            } catch (e) { }

            fallbackSpeech(fallbackText);
        }

        function fallbackSpeech(words) {
            if (!('speechSynthesis' in window)) return;
            try {
                speechSynthesis.cancel();
                const msg = new SpeechSynthesisUtterance(words);
                msg.lang = 'en-US';
                msg.rate = 0.95;
                msg.pitch = 1.0;
                msg.volume = 1.0;

                const voices = speechSynthesis.getVoices ? speechSynthesis.getVoices() : [];
                if (voices && voices.length) {
                    msg.voice = voices.find(v => /natural|neural|online|google\s+us|microsoft\s+guy|microsoft\s+david|samantha/i.test(v.name))
                        || voices.find(v => /^en[-_]us/i.test(v.lang))
                        || voices[0];
                }
                speechSynthesis.speak(msg);
            } catch (e) { }
        }

        // Start periodic voice announcements
        setTimeout(() => {
            triggerVoiceAnnouncement();
            setInterval(triggerVoiceAnnouncement, ANNOUNCE_INTERVAL * 1000);
        }, 10000); // First announcement after 10 seconds

        // ═══════════════════════════════════════════════════════════════
        // 4. ANIMATED OVERLAYS & ENGAGEMENT BURSTS
        // ═══════════════════════════════════════════════════════════════
        const bannerCard = document.getElementById('bannerCard');
        const reactionBox = document.getElementById('reactionBox');

        function highlightBanner() {
            if (!bannerCard) return;
            bannerCard.classList.add('highlight');
            setTimeout(() => {
                bannerCard.classList.remove('highlight');
            }, 6000);
        }

        const EMOJIS = ['❤️', '💖', '🔥', '👍', '❤️', '❤️'];
        function spawnReaction() {
            if (!reactionBox) return;
            const el = document.createElement('div');
            el.className = 'floating-heart';
            el.textContent = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
            el.style.left = `${Math.floor(Math.random() * 50)}px`;
            el.style.fontSize = `${Math.floor(Math.random() * 14 + 22)}px`;
            reactionBox.appendChild(el);
            setTimeout(() => el.remove(), 1500);
        }

        function spawnReactionBurst() {
            for (let i = 0; i < 6; i++) {
                setTimeout(spawnReaction, i * 220);
            }
        }

        // Ambient reactions floating up periodically
        setInterval(() => {
            if (Math.random() > 0.4) spawnReaction();
        }, 4000);
    </script>
</body>

</html>
