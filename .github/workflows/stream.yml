name: 24/7 YouTube Live Video Stream with Voice Announcements

on:
  workflow_dispatch:
    inputs:
      video_file:
        description: 'Uploaded video file name or direct URL (e.g. video.mp4)'
        required: false
        default: 'video.mp4'
      start_time:
        description: 'Start time (e.g. 90, 1:30, or 2m15s). Leave empty to start from 0'
        required: false
        default: ''
  schedule:
    # 2 segments × 5 hours = 10 hours/day (IST = UTC+5:30)
    - cron: '30 6 * * *'   # Segment 1: 12:00 PM IST → 5:00 PM IST
    - cron: '30 11 * * *'  # Segment 2:  5:00 PM IST → 10:00 PM IST

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 310   # 5 hrs + 10 min buffer for setup

    steps:
      - name: Checkout HTML files
        uses: actions/checkout@v4

      # ── Install all multimedia & audio packages ───────────────────────
      - name: Install FFmpeg, Xvfb, Chromium/Chrome, PulseAudio, TTS, unclutter
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg xvfb \
            pulseaudio pulseaudio-utils python3-pip \
            espeak-ng speech-dispatcher speech-dispatcher-espeak-ng \
            unclutter

      # ── Generate Ultra-HD Studio Announcer Audio ─────────────────────
      - name: Generate Natural Broadcast Announcer Audio
        run: |
          pip install --upgrade edge-tts
          python3 generate_voices.py

      # ── Start Local Web Server (serves audio clips & game flawlessly) ─
      - name: Start Local HTTP Server
        run: |
          python3 -m http.server 8080 --directory "$GITHUB_WORKSPACE" &
          sleep 2

      # ── Start PulseAudio Virtual Sink (captures all game audio) ───────
      - name: Start PulseAudio with virtual sink
        run: |
          export XDG_RUNTIME_DIR=/tmp/pulse-runtime
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          pulseaudio --daemonize=no --exit-idle-time=-1 \
            --load="module-native-protocol-unix auth-anonymous=1 socket=/tmp/pulseaudio.socket" \
            --load="module-null-sink sink_name=virtual_out sink_properties=device.description=VirtualSpeaker" &
          sleep 2
          pactl --server=unix:/tmp/pulseaudio.socket set-default-sink virtual_out
          echo "PULSE_SERVER=unix:/tmp/pulseaudio.socket" >> $GITHUB_ENV
          echo "XDG_RUNTIME_DIR=/tmp/pulse-runtime" >> $GITHUB_ENV

      # ── Speech Dispatcher (TTS voices) ────────────────────────────────
      - name: Configure and start Speech Dispatcher
        run: |
          mkdir -p ~/.config/speech-dispatcher
          cat > ~/.config/speech-dispatcher/speechd.conf << 'EOF'
          DefaultModule espeak-ng
          DefaultLanguage en
          DefaultVoiceType MALE1
          AudioOutputMethod pulse
          AudioPulseServer unix:/tmp/pulseaudio.socket
          EOF
          speech-dispatcher -d
          sleep 2

      # ── Xvfb Virtual Screen (1920×1080 60Hz Horizontal 16:9) ─────────
      - name: Start Xvfb horizontal 16:9 screen
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2
          DISPLAY=:99 unclutter -idle 0 -root &

      # ── Launch Chromium with audio & high graphics enabled ───────────
      - name: Launch Browser in kiosk mode
        run: |
          BROWSER=$(which google-chrome-stable || which google-chrome || which chromium-browser || which chromium)
          echo "Launching browser: $BROWSER"
          V_FILE="${{ github.event.inputs.video_file || secrets.VIDEO_FILE || 'video.mp4' }}"
          V_START="${{ github.event.inputs.start_time || secrets.START_TIME || '' }}"
          TARGET_URL="http://127.0.0.1:8080/index.html"
          QUERY=""
          if [ -n "$V_FILE" ]; then
            ENCODED_FILE=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1]))" "$V_FILE")
            QUERY="v=$ENCODED_FILE"
          fi
          if [ -n "$V_START" ]; then
            ENCODED_START=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1]))" "$V_START")
            if [ -n "$QUERY" ]; then
              QUERY="${QUERY}&t=$ENCODED_START"
            else
              QUERY="t=$ENCODED_START"
            fi
          fi
          if [ -n "$QUERY" ]; then
            TARGET_URL="http://127.0.0.1:8080/index.html?${QUERY}"
          fi
          echo "Opening stream page: $TARGET_URL"
          DISPLAY=:99 PULSE_SERVER=unix:/tmp/pulseaudio.socket \
          $BROWSER \
            --no-sandbox \
            --disable-gpu \
            --kiosk \
            --hide-scrollbars \
            --window-size=1920,1080 \
            --window-position=0,0 \
            --allow-file-access-from-files \
            --autoplay-policy=no-user-gesture-required \
            --disable-features=AutoplayIgnoreWebAudio \
            --enable-audio-focus-enforcement=false \
            --use-fake-ui-for-media-stream \
            --enable-speech-dispatcher \
            --enable-features=SpeechDispatcher \
            --no-first-run \
            --disable-translate \
            --disable-infobars \
            --disable-notifications \
            --disable-background-timer-throttling \
            --disable-renderer-backgrounding \
            --disable-backgrounding-occluded-windows \
            "$TARGET_URL" &
          sleep 8

      # ── Stream to YouTube Live (Fluid 1080p 16:9 Broadcast) ───────────
      # (30 FPS with ultrafast preset ensures zero dropped frames
      #  and leaves plenty of CPU for Chromium, eliminating all lag)
      - name: Stream 5 hours to YouTube
        env:
          KEY: ${{ secrets.STREAM_KEY }}
        run: |
          DISPLAY=:99 PULSE_SERVER=unix:/tmp/pulseaudio.socket \
          timeout 18000 ffmpeg -re \
            -thread_queue_size 1024 -f x11grab -draw_mouse 0 \
            -video_size 1920x1080 -framerate 30 -i :99.0 \
            -thread_queue_size 1024 -f pulse -i virtual_out.monitor \
            -c:v libx264 -preset ultrafast \
              -b:v 6000k -maxrate 6500k -bufsize 12000k \
              -pix_fmt yuv420p -g 60 -tune zerolatency \
            -c:a aac -b:a 192k -ar 44100 -ac 2 \
            -threads 2 \
            -f flv "rtmp://a.rtmp.youtube.com/live2/$KEY" || true
