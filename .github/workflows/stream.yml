name: 24/7 3D Piano Live Stream (YouTube Shorts 9:16)

on:
  workflow_dispatch:
  schedule:
    # 2 segments × 5 hours = 10 hours/day (IST = UTC+5:30)
    - cron: '30 6 * * *'   # Segment 1: 12:00 PM IST → 5:00 PM IST
    - cron: '30 11 * * *'  # Segment 2:  5:00 PM IST → 10:00 PM IST

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 310   # 5 hrs + 10 min buffer for setup

    steps:
      - name: Checkout repository files
        uses: actions/checkout@v4

      # ── Install multimedia & headless browser packages ───────────────
      - name: Install FFmpeg, Xvfb, PulseAudio, Chromium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg xvfb pulseaudio pulseaudio-utils unclutter
          if ! which google-chrome &>/dev/null && ! which chromium-browser &>/dev/null && ! which chromium &>/dev/null; then
            sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium || true
          fi

      # ── Start Local Web Server for 3D Piano ──────────────────────────
      - name: Start Local HTTP Server
        run: |
          python3 server.py &
          sleep 2

      # ── Start PulseAudio Virtual Sink (captures synthesizer audio) ────
      - name: Start PulseAudio with virtual sink
        run: |
          export XDG_RUNTIME_DIR=/tmp/pulse-runtime
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          pulseaudio --daemonize=no --exit-idle-time=-1 \
            --load="module-native-protocol-unix auth-anonymous=1 socket=/tmp/pulseaudio.socket" \
            --load="module-null-sink sink_name=virtual_out sink_properties=device.description=VirtualSpeaker" &
          sleep 2
          pactl --server=unix:/tmp/pulseaudio.socket set-default-sink virtual_out
          echo "PULSE_SERVER=unix:/tmp/pulseaudio.socket" >> $GITHUB_ENV
          echo "XDG_RUNTIME_DIR=/tmp/pulse-runtime" >> $GITHUB_ENV

      # ── Xvfb Virtual Screen (1080×1920 9:16 Vertical Shorts Format) ───
      - name: Start Xvfb 1080x1920 vertical screen
        run: |
          Xvfb :99 -screen 0 1080x1920x24 &
          sleep 2
          DISPLAY=:99 unclutter -idle 0 -root &

      # ── Launch Chromium with 3D WebGL Piano & Autoplay ───────────────
      - name: Launch 3D Piano in Kiosk Mode
        run: |
          BROWSER=$(which google-chrome-stable || which google-chrome || which chromium-browser || which chromium)
          echo "Launching browser: $BROWSER"

          DISPLAY=:99 PULSE_SERVER=unix:/tmp/pulseaudio.socket \
          $BROWSER \
            --no-sandbox \
            --disable-dev-shm-usage \
            --use-gl=angle \
            --use-angle=swiftshader \
            --enable-gpu-rasterization \
            --enable-zero-copy \
            --disable-gpu-vsync \
            --kiosk \
            --hide-scrollbars \
            --window-size=1080,1920 \
            --window-position=0,0 \
            --autoplay-policy=no-user-gesture-required \
            --disable-features=AutoplayIgnoreWebAudio,Translate,OptimizationHints \
            --enable-audio-focus-enforcement=false \
            --no-first-run \
            --disable-translate \
            --disable-infobars \
            --disable-notifications \
            --disable-background-timer-throttling \
            --disable-renderer-backgrounding \
            --disable-backgrounding-occluded-windows \
            "http://127.0.0.1:8080/index.html" &
          sleep 6

      # ── Stream to YouTube Live (1080x1920 6800 Kbps Zero-Lag) ─────────
      - name: Stream 5 hours to YouTube
        env:
          KEY: ${{ secrets.STREAM_KEY || secrets.YOUTUBE_STREAM_KEY || secrets.YOUTUBE_KEY || secrets.LIVE_KEY }}
        run: |
          STREAM_KEY=$(echo "$KEY" | tr -d '[:space:]')
          if [ -z "$STREAM_KEY" ]; then
            echo "=========================================================================="
            echo "::error:: STREAM_KEY secret is missing!"
            echo "Please go to: Repository -> Settings -> Secrets and variables -> Actions"
            echo "Create a repository secret named: STREAM_KEY with your YouTube stream key."
            echo "=========================================================================="
            exit 1
          fi

          echo "Broadcasting 3D Piano Live Stream to YouTube Shorts in 1080x1920..."
          DISPLAY=:99 PULSE_SERVER=unix:/tmp/pulseaudio.socket \
          timeout 18000 ffmpeg -nostdin \
            -thread_queue_size 1024 -f x11grab -draw_mouse 0 \
            -video_size 1080x1920 -framerate 30 -i :99.0 \
            -thread_queue_size 1024 -f pulse -i virtual_out.monitor \
            -c:v libx264 -preset ultrafast \
              -b:v 6800k -minrate 6500k -maxrate 7000k -bufsize 14000k \
              -pix_fmt yuv420p -g 60 -keyint_min 60 -sc_threshold 0 \
            -c:a aac -b:a 192k -ar 44100 -ac 2 \
            -threads 2 \
            -flvflags no_duration_filesize \
            -f flv "rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY"

          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 124 ] || [ $EXIT_CODE -eq 0 ]; then
            echo "Stream segment completed successfully."
          else
            echo "FFmpeg exited with code $EXIT_CODE"
            exit $EXIT_CODE
          fi
