name: 24/7 3D Piano Live Stream (YouTube Shorts 9:16)

on:
  workflow_dispatch:
  schedule:
    # 2 segments × 5 hours = 10 hours/day (IST = UTC+5:30)
    - cron: '30 6 * * *'   # Segment 1: 12:00 PM IST → 5:00 PM IST
    - cron: '30 11 * * *'  # Segment 2:  5:00 PM IST → 10:00 PM IST

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 310   # 5 hrs + 10 min buffer for setup

    steps:
      - name: Checkout repository files
        uses: actions/checkout@v4

      # ── Install multimedia & headless browser packages ───────────────
      - name: Install FFmpeg, Xvfb, PulseAudio, Chromium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg xvfb pulseaudio pulseaudio-utils unclutter
          if ! which google-chrome &>/dev/null && ! which chromium-browser &>/dev/null && ! which chromium &>/dev/null; then
            sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium || true
          fi

      # ── Run 24/7 Python Live Stream Engine (Zero-Lag 6800 Kbps CBR) ──
      - name: Run 5-Hour Python Live Stream
        env:
          STREAM_KEY: ${{ secrets.STREAM_KEY || secrets.YOUTUBE_STREAM_KEY || secrets.YOUTUBE_KEY || secrets.LIVE_KEY }}
        run: |
          python3 stream.py
