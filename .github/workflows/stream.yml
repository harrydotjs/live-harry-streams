name: World Clash Fight – Daily 10hr Stream

on:
  workflow_dispatch:   # keep for manual test runs
  schedule:
    # 2 segments × 5 hours = 10 hours/day  (IST = UTC+5:30)
    - cron: '30 6 * * *'   # Segment 1: 12:00 PM IST → 5:00 PM IST
    - cron: '30 11 * * *'  # Segment 2:  5:00 PM IST → 10:00 PM IST

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 310   # 5 hrs + 10 min buffer for setup

    steps:
      - name: Checkout HTML files
        uses: actions/checkout@v4

      - name: Install FFmpeg, Xvfb, Chromium, PulseAudio, TTS, unclutter
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg xvfb chromium-browser \
            pulseaudio pulseaudio-utils \
            espeak-ng speech-dispatcher speech-dispatcher-espeak-ng \
            unclutter

      - name: Start PulseAudio with virtual sink
        run: |
          pulseaudio --start \
            --load="module-null-sink sink_name=virtual_out sink_properties=device.description=VirtualSpeaker" \
            --load="module-virtual-source source_name=virtual_in master=virtual_out.monitor" \
            --exit-idle-time=-1
          sleep 2
          pactl set-default-sink virtual_out
          pactl set-default-source virtual_in

      - name: Configure and start Speech Dispatcher (TTS voices)
        run: |
          mkdir -p ~/.config/speech-dispatcher
          cat > ~/.config/speech-dispatcher/speechd.conf << 'EOF'
          DefaultModule espeak-ng
          DefaultLanguage en
          DefaultVoiceType MALE1
          AudioOutputMethod pulse
          AudioPulseServer unix:/run/user/$(id -u)/pulse/native
          EOF
          speech-dispatcher
          sleep 2

      - name: Start Xvfb 1080p vertical screen
        run: |
          Xvfb :99 -screen 0 1080x1920x24 &
          sleep 2
          DISPLAY=:99 unclutter -idle 0 -root &

      - name: Launch Chromium in 1080p kiosk mode
        run: |
          DISPLAY=:99 PULSE_SERVER=unix:/run/user/$(id -u)/pulse/native \
          chromium-browser \
            --no-sandbox \
            --disable-gpu \
            --kiosk \
            --window-size=1080,1920 \
            --window-position=0,0 \
            --autoplay-policy=no-user-gesture-required \
            --disable-features=AutoplayIgnoreWebAudio \
            --enable-audio-focus-enforcement=false \
            --use-fake-ui-for-media-stream \
            --enable-speech-dispatcher \
            --no-first-run \
            --disable-translate \
            --disable-infobars \
            --disable-notifications \
            --disable-background-timer-throttling \
            --disable-renderer-backgrounding \
            --disable-backgrounding-occluded-windows \
            "file://$GITHUB_WORKSPACE/index.html" &
          sleep 8

      - name: Stream 5 hours to YouTube (1080p)
        env:
          KEY: ${{ secrets.STREAM_KEY }}
        run: |
          DISPLAY=:99 timeout 18000 ffmpeg -re \
            -f x11grab -video_size 1080x1920 -framerate 30 -i :99.0 \
            -f pulse -i virtual_in \
            -c:v libx264 -preset veryfast -crf 18 \
              -b:v 6000k -maxrate 8000k -bufsize 16000k \
              -pix_fmt yuv420p -g 60 -tune zerolatency \
            -c:a aac -b:a 192k -ar 44100 -ac 2 \
            -f flv "rtmp://a.rtmp.youtube.com/live2/$KEY" || true
